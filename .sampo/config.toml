# Sampo configuration
version = 1

[git]
default_branch = "main"

[github]
repository = "imjlk/qc2"

[changesets]
tags = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]

[changelog]
show_commit_hash = true
show_acknowledgments = true

[packages]
# qc2 is a Go module. Sampo has no Go adapter, so changesets name the CLI
# without an ecosystem prefix. scripts/prepare-release.go consumes them into
# CHANGELOG.md. Do not invent an npm or Cargo package id.
ignore_unpublished = false
